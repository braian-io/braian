[package]
name = "braian-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[dependencies]
braian-indexer.workspace = true
braian-merge.workspace = true
braian-model = { workspace = true, features = ["openapi"] }
braian-rules.workspace = true
braian-search.workspace = true
braian-store.workspace = true

argon2.workspace = true
axum.workspace = true
base64 = "0.22"
chrono.workspace = true
futures.workspace = true
getrandom.workspace = true
hex.workspace = true
reqwest.workspace = true
rust_xlsxwriter = { workspace = true, features = ["constant_memory"] }
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time", "rt", "macros", "sync"] }
tracing.workspace = true
utoipa.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
