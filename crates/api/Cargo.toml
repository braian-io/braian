calamine = { version = "0.26.1", features = ["dates"] }
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.7"
strsim = "0.11.1"
bincode = "1.3.3"
unicode-normalization = "0.1.24"

[dev-dependencies]
braian-store.workspace = true
tokio-postgres.workspace = true

axum.workspace = true
http-body-util = "0.1"
