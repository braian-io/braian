[workspace]
resolver = "3"
members = ["crates/*"]

# Argon2id is CPU-heavy. An unoptimized debug build made login take about ten
# seconds. These crates stay optimized so `cargo run` can still verify a password.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# CI server, bench, and the store/indexer integration tests share this profile.
# It stays optimized like release, and it keeps the checks release turns off,
# so a passing `cargo test --profile ci` still runs debug assertions.
[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
mimalloc = { version = "0.1", default-features = false }
braian-model = { path = "crates/model" }
braian-rules = { path = "crates/rules" }
braian-store = { path = "crates/store" }
braian-events = { path = "crates/events" }
braian-search = { path = "crates/search" }
braian-api = { path = "crates/api" }
braian-indexer = { path = "crates/indexer" }
braian-merge = { path = "crates/merge" }

anyhow = "1"
argon2 = "0.5"
getrandom = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_xlsxwriter = "0.80"
sha2 = "0.10"
axum = { version = "0.8", features = ["json", "macros"] }
tower = { version = "0.5", features = ["util"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
futures = "0.3"
proptest = "1"
rand = "0.10"
rand_chacha = "0.10"
refinery = { version = "0.8", features = ["tokio-postgres"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1", "with-chrono-0_4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", default-features = false, features = ["std", "serde", "v7"] }
utoipa = { version = "5", features = ["macros", "uuid"] }
# Keep this in lockstep with wasm-bindgen-cli in the devcontainer, justfile and CI.
wasm-bindgen = "=0.2.129"
