name: ${COMPOSE_PROJECT_NAME:-braian}

services:
  postgres:
    image: postgres:18
    command:
      - postgres
      # Spike 1 compares WAL volume. Compression and a wide checkpoint window
      # keep the forms on the same settings, and keep a checkpoint from landing
      # in the middle of a short run.
      - -c
      - wal_compression=lz4
      - -c
      - default_toast_compression=lz4
      - -c
      - max_wal_size=8GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?sätt i .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?sätt i .env}
      POSTGRES_DB: ${POSTGRES_DB:?sätt i .env}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:?sätt i .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  typesense:
    image: typesense/typesense:30.2
    command:
      - --data-dir=/data
      - --api-key=${TYPESENSE_API_KEY:?sätt i .env}
      - --enable-cors
    ports:
      - "${TYPESENSE_HOST_PORT:-8108}:8108"
    volumes:
      - typesense-data:/data

volumes:
  postgres-data:
  typesense-data:
  # Import files are spooled on the API host (BRAIAN_IMPORT_DIR, default ./data/imports).
  # There is no API service in this file yet; mount that directory when one is added.
