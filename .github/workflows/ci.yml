name: CI

on:
  pull_request:
  # Push to main fills the caches a new PR is allowed to read. Pull-request
  # caches are not visible to other PRs, so without this every new PR is cold.
  push:
    branches: [main]

# A new push to the same ref cancels the run that is already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Classify CI diffs
        run: |
          bash scripts/ci-changes.test.sh
          bash scripts/ci-aggregate.test.sh
          bash scripts/ci-hurl.test.sh
          bash scripts/ci-dirty-rust.test.sh
          bash scripts/ci-guard-bins.test.sh
      # Heavy steps stay in this job so a required check still completes green
      # when the diff is docs, markdown, the landing page, or web-only.
      # Web-only diffs do not compile Rust; stack still runs e2e on a cached binary.
      - name: Detect code changes
        id: changes
        run: |
          # A push to main builds and saves caches. There is no PR diff.
          if [ "${{ github.event_name }}" = push ]; then
            echo "mode=full" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | bash scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
      - name: Stabilize Rust source mtimes
        if: steps.changes.outputs.mode == 'full'
        run: find crates docs/api testdata Cargo.toml Cargo.lock rust-toolchain.toml -exec touch -d '2020-01-01T00:00:00Z' {} +
      - run: rustup show
        if: steps.changes.outputs.mode == 'full'
      - name: Check Rust cache
        id: rust-cache-lookup
        if: steps.changes.outputs.mode == 'full'
        uses: Swatinem/rust-cache@v2
        with:
          lookup-only: "true"
          # One key per job. Parallel jobs build different profiles, and a
          # GitHub cache entry cannot be updated once saved. v2 is the
          # generation that contains profile.ci artifacts, filled by the first
          # full run of this prefix and then by pushes to main.
          prefix-key: v2-rust-ci
          shared-key: ${{ github.job }}
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.mode == 'full'
        with:
          prefix-key: v2-rust-ci
          shared-key: ${{ github.job }}
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          # Restore order is this ref, then the PR base, then main. An exact
          # hit is not uploaded again, so a PR does not copy main's cache.
          # The key hashes Cargo.lock and rustc, not .rs sources, so this can
          # restore a target/ built from an older main commit.
          save-if: ${{ steps.rust-cache-lookup.outputs.cache-hit != 'true' }}
      # Source hash in the key, with a lockfile prefix as the fallback.
      # A push to main that changes Rust stores a new entry. The next job
      # restores that entry exactly, or the newest target for the same
      # lockfile. This runs after rust-cache so a hit replaces a stale
      # target/ from the registry cache. rust-cache strips loose files in
      # target/ on upload; the marker is kept by the save step below.
      - name: Restore Rust target
        id: target-cache
        if: steps.changes.outputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: target
          key: braian-target-v1-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'docs/api/**', 'testdata/**') }}
          restore-keys: |
            braian-target-v1-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            braian-target-v1-${{ runner.os }}-${{ github.job }}-
      - name: Dirty Rust sources newer than the cached target
        if: steps.changes.outputs.mode == 'full'
        run: bash scripts/ci-dirty-rust.sh
      - name: Start Postgres
        if: steps.changes.outputs.mode == 'full'
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=braian
          POSTGRES_PASSWORD=braian
          POSTGRES_DB=braian
          POSTGRES_READONLY_PASSWORD=braian-readonly
          POSTGRES_HOST_PORT=5433
          TYPESENSE_API_KEY=ci
          DATABASE_URL=postgres://braian:braian@localhost:5433/braian
          BRAIAN_TEST_DATABASE_URL=postgres://braian:braian@localhost:5433/postgres
          EOF
          docker compose up -d --wait postgres
      - name: Baseline migrations from main
        if: steps.changes.outputs.mode == 'full'
        run: |
          git fetch --no-tags --depth=1 origin main
          dest="${RUNNER_TEMP}/baseline-migrations"
          mkdir -p "$dest"
          git archive origin/main crates/store/migrations | tar -x --strip-components=3 -C "$dest"
          test -f "$dest/V3__app.sql"
          echo "BRAIAN_BASELINE_MIGRATIONS=$dest" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
        if: steps.changes.outputs.mode == 'full'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: steps.changes.outputs.mode == 'full'
      - name: Cache cargo-nextest
        if: steps.changes.outputs.mode == 'full'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: taiki-e/install-action@v2
        if: steps.changes.outputs.mode == 'full'
        with:
          tool: nextest
      - name: Test
        if: steps.changes.outputs.mode == 'full'
        run: cargo nextest run --workspace --no-tests=pass
        env:
          BRAIAN_TEST_DATABASE_URL: postgres://braian:braian@localhost:5433/postgres
          DATABASE_URL: postgres://braian:braian@localhost:5433/braian
      - name: rules måste kompilera till WebAssembly
        if: steps.changes.outputs.mode == 'full'
        run: cargo build -p braian-rules -p braian-rules-wasm --target wasm32-unknown-unknown
      - name: Record Rust target commit
        if: success() && steps.changes.outputs.mode == 'full'
        run: bash scripts/ci-dirty-rust.sh stamp
      - name: Save Rust target
        if: success() && steps.changes.outputs.mode == 'full' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target
          key: braian-target-v1-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'docs/api/**', 'testdata/**') }}

  phase-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect code changes
        id: changes
        run: |
          # A push to main builds and saves caches. There is no PR diff.
          if [ "${{ github.event_name }}" = push ]; then
            echo "mode=full" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | bash scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
      - name: Stabilize Rust source mtimes
        if: steps.changes.outputs.mode == 'full'
        run: find crates docs/api testdata Cargo.toml Cargo.lock rust-toolchain.toml -exec touch -d '2020-01-01T00:00:00Z' {} +
      - run: rustup show
        if: steps.changes.outputs.mode == 'full'
      - name: Check Rust cache
        id: rust-cache-lookup
        if: steps.changes.outputs.mode == 'full'
        uses: Swatinem/rust-cache@v2
        with:
          lookup-only: "true"
          prefix-key: v2-rust-ci
          shared-key: ${{ github.job }}
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.mode == 'full'
        with:
          prefix-key: v2-rust-ci
          shared-key: ${{ github.job }}
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          # Restore order is this ref, then the PR base, then main. An exact
          # hit is not uploaded again, so a PR does not copy main's cache.
          # The key hashes Cargo.lock and rustc, not .rs sources.
          save-if: ${{ steps.rust-cache-lookup.outputs.cache-hit != 'true' }}
      - name: Restore Rust target
        id: target-cache
        if: steps.changes.outputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: target
          key: braian-target-v1-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'docs/api/**', 'testdata/**') }}
          restore-keys: |
            braian-target-v1-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            braian-target-v1-${{ runner.os }}-${{ github.job }}-
      - name: Dirty Rust sources newer than the cached target
        if: steps.changes.outputs.mode == 'full'
        run: bash scripts/ci-dirty-rust.sh
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.mode == 'full'
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        if: steps.changes.outputs.mode == 'full'
        with:
          tool: just,wasm-bindgen-cli@0.2.129
      - run: just demo-1
        if: steps.changes.outputs.mode == 'full'
      - run: just test-wasm
        if: steps.changes.outputs.mode == 'full'
      - name: Record Rust target commit
        if: success() && steps.changes.outputs.mode == 'full'
        run: bash scripts/ci-dirty-rust.sh stamp
      - name: Save Rust target
        if: success() && steps.changes.outputs.mode == 'full' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target
          key: braian-target-v1-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'docs/api/**', 'testdata/**') }}

  # One profile.ci build. Shards and the load job restore the same exact
  # binary key and do not compile. shared-key stays `stack` so a pull request
  # still hits the cache pushed from main under the old job name.
  # Web-only diffs restore main's binary and skip this compile.
  bins:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect code changes
        id: changes
        run: |
          # A push to main builds and saves caches. There is no PR diff.
          if [ "${{ github.event_name }}" = push ]; then
            echo "mode=full" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | bash scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
      - name: Restore release binaries
        id: bin-cache
        if: steps.changes.outputs.mode != 'skip'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-bins
          # Exact key only. No restore-keys: a prefix match would replay a
          # binary from older Rust. actions/cache looks up this ref, then the
          # PR base, then main.
          # crates/** already covers crates/store/migrations. No migration
          # tree lives outside crates/. This hash was not the stale-rlib
          # failure: that build missed and compiled. v2 drops binaries
          # linked before the mtime fix, so this run compiles for real.
          key: braian-bins-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'testdata/**') }}
      - name: Plan Rust build
        id: plan
        if: steps.changes.outputs.mode != 'skip'
        run: |
          mode="${{ steps.changes.outputs.mode }}"
          hit="${{ steps.bin-cache.outputs.cache-hit }}"
          echo "mode=$mode bin-cache-hit=$hit"
          # The cache key is a hash of the Rust sources. A hit is this tree's
          # binary, including on a full diff that did not touch Rust. A miss
          # compiles, so e2e never runs a stale server.
          if [ "$hit" != true ]; then
            echo "compile=true" >> "$GITHUB_OUTPUT"
          else
            echo "compile=false" >> "$GITHUB_OUTPUT"
            echo "Release binary cache hit for this Rust hash; cargo build skipped."
          fi
      - name: Stabilize Rust source mtimes
        if: steps.plan.outputs.compile == 'true'
        run: |
          # Cargo fingerprints local crates by mtime. A fresh checkout is newer
          # than the cached fingerprints, so workspace crates recompile on every
          # hit. Pin the mtimes before restore and before the build.
          find crates docs/api testdata Cargo.toml Cargo.lock rust-toolchain.toml -exec touch -d '2020-01-01T00:00:00Z' {} +
      - run: rustup show
        if: steps.plan.outputs.compile == 'true'
      - name: Check Rust cache
        id: rust-cache-lookup
        if: steps.plan.outputs.compile == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          lookup-only: "true"
          prefix-key: v2-rust-ci
          shared-key: stack
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.compile == 'true'
        with:
          prefix-key: v2-rust-ci
          shared-key: stack
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          # Restore order is this ref, then the PR base, then main. An exact
          # hit is not uploaded again, so a PR does not copy main's cache.
          save-if: ${{ steps.rust-cache-lookup.outputs.cache-hit != 'true' }}
      # Same source-hash target cache as the rust job. `stack` is shared
      # with load; github.job would split them.
      - name: Restore Rust target
        id: target-cache
        if: steps.plan.outputs.compile == 'true'
        uses: actions/cache/restore@v4
        with:
          path: target
          key: braian-target-v1-${{ runner.os }}-stack-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'docs/api/**', 'testdata/**') }}
          restore-keys: |
            braian-target-v1-${{ runner.os }}-stack-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            braian-target-v1-${{ runner.os }}-stack-
      - name: Dirty Rust sources newer than the cached target
        if: steps.plan.outputs.compile == 'true'
        run: bash scripts/ci-dirty-rust.sh
      - name: Build profile.ci binaries
        if: steps.plan.outputs.compile == 'true'
        run: |
          cargo build --profile ci --locked -p braian-bench -p braian-server
          bash scripts/ci-guard-bins.sh
          bash scripts/ci-dirty-rust.sh stamp
          mkdir -p "${RUNNER_TEMP}/ci-bins"
          cp -a target/ci/braian target/ci/braian-bench "${RUNNER_TEMP}/ci-bins/"
          test -x "${RUNNER_TEMP}/ci-bins/braian"
          test -x "${RUNNER_TEMP}/ci-bins/braian-bench"
      - name: Save Rust target
        if: success() && steps.plan.outputs.compile == 'true' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target
          key: braian-target-v1-${{ runner.os }}-stack-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'docs/api/**', 'testdata/**') }}
      - name: Save release binaries
        if: success() && steps.plan.outputs.compile == 'true' && steps.bin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ci-bins
          key: braian-bins-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'testdata/**') }}

  # Phase 2, phase 3, and the profile.ci store/indexer tests. Not on the e2e
  # critical path: shards restore the binary as soon as `bins` has saved it.
  load:
    needs: bins
    if: needs.bins.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore release binaries
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-bins
          key: braian-bins-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'testdata/**') }}
      - name: Require cached binaries
        run: |
          test -x "${RUNNER_TEMP}/ci-bins/braian"
          test -x "${RUNNER_TEMP}/ci-bins/braian-bench"
      - name: Start Postgres and Typesense
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=braian
          POSTGRES_PASSWORD=braian
          POSTGRES_DB=braian
          POSTGRES_READONLY_PASSWORD=braian-readonly
          POSTGRES_HOST_PORT=5433
          TYPESENSE_API_KEY=ci
          DATABASE_URL=postgres://braian:braian@localhost:5433/braian
          BRAIAN_TEST_DATABASE_URL=postgres://braian:braian@localhost:5433/postgres
          TYPESENSE_URL=http://localhost:8108
          EOF
          docker compose up -d postgres typesense
      - name: Cache hurl
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hurl-bin
          key: hurl-8.0.1-${{ runner.os }}-x86_64
      - name: Install hurl
        env:
          HURL_CACHE_DIR: ${{ runner.temp }}/hurl-bin
        run: bash scripts/ci-hurl.sh
      - name: Stabilize Rust source mtimes
        run: find crates docs/api testdata Cargo.toml Cargo.lock rust-toolchain.toml -exec touch -d '2020-01-01T00:00:00Z' {} +
      - run: rustup show
      - name: Check Rust cache
        id: rust-cache-lookup
        uses: Swatinem/rust-cache@v2
        with:
          lookup-only: "true"
          prefix-key: v2-rust-ci
          shared-key: stack
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust-ci
          shared-key: stack
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          cache-on-failure: "true"
          # A hit is main's or bins' cache. Uploading it again spends the quota.
          save-if: ${{ steps.rust-cache-lookup.outputs.cache-hit != 'true' }}
      - name: Restore Rust target
        id: target-cache
        uses: actions/cache/restore@v4
        with:
          path: target
          key: braian-target-v1-${{ runner.os }}-stack-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'docs/api/**', 'testdata/**') }}
          restore-keys: |
            braian-target-v1-${{ runner.os }}-stack-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            braian-target-v1-${{ runner.os }}-stack-
      - name: Dirty Rust sources newer than the cached target
        run: bash scripts/ci-dirty-rust.sh
      - name: Wait for services
        run: docker compose up -d --wait postgres typesense
      - name: Phase 2 load
        env:
          DATABASE_URL: postgres://braian:braian@localhost:5433/braian
        run: |
          test -x "${RUNNER_TEMP}/ci-bins/braian-bench"
          "${RUNNER_TEMP}/ci-bins/braian-bench" demo-2 --tier light --count 100000
      - name: Phase 3 Hurl
        env:
          DATABASE_URL: postgres://braian:braian@localhost:5433/braian
        run: |
          "${RUNNER_TEMP}/ci-bins/braian-bench" demo-3
      - name: Change log resumes, coalesces and wakes listeners
        run: |
          cargo test --profile ci --locked -p braian-store -p braian-api --test change_log -- --test-threads=1
          cargo test --profile ci --locked -p braian-indexer -p braian-api --test log -- --test-threads=1
        env:
          BRAIAN_TEST_DATABASE_URL: postgres://braian:braian@localhost:5433/postgres
          DATABASE_URL: postgres://braian:braian@localhost:5433/braian
      - name: Indexer converges and reindex swaps the alias
        run: cargo test --profile ci --locked -p braian-indexer -p braian-api --test converge -- --test-threads=1
        env:
          BRAIAN_TEST_DATABASE_URL: postgres://braian:braian@localhost:5433/postgres
          DATABASE_URL: postgres://braian:braian@localhost:5433/braian
          TYPESENSE_URL: http://localhost:8108
          TYPESENSE_API_KEY: ci

  # Six runners, each with its own Postgres, Typesense and seed. Four bins
  # still put about three minutes of measured spec time on the heaviest one
  # (field-picker plus the next longest files). fail-fast is off so one
  # failure does not cancel the others into a skipped-looking green.
  e2e:
    needs: bins
    if: needs.bins.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Restore release binaries
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-bins
          key: braian-bins-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'testdata/**') }}
      - name: Require cached server binary
        run: test -x "${RUNNER_TEMP}/ci-bins/braian"
      - name: Start Postgres and Typesense
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=braian
          POSTGRES_PASSWORD=braian
          POSTGRES_DB=braian
          POSTGRES_READONLY_PASSWORD=braian-readonly
          POSTGRES_HOST_PORT=5433
          TYPESENSE_API_KEY=ci
          DATABASE_URL=postgres://braian:braian@localhost:5433/braian
          BRAIAN_TEST_DATABASE_URL=postgres://braian:braian@localhost:5433/postgres
          TYPESENSE_URL=http://localhost:8108
          EOF
          docker compose up -d postgres typesense
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright-version
        run: |
          version=$(pnpm --dir apps/web exec node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --dir apps/web exec playwright install-deps chromium
      - name: Wait for services
        run: docker compose up -d --wait postgres typesense
      - name: Playwright shard
        env:
          DATABASE_URL: postgres://braian:braian@localhost:5433/braian
          POSTGRES_USER: braian
          TYPESENSE_URL: http://localhost:8108
          TYPESENSE_API_KEY: ci
          BRAIAN_DEMO_EMAIL: admin@braian.local
          BRAIAN_DEMO_PASSWORD: braian-demo
          BRAIAN_DEMO_TOKEN: braian-demo-token
          BRAIAN_AGENT_MOCK: "1"
          BRAIAN_E2E_SHARDS: "6"
          BRAIAN_E2E_SHARD: ${{ matrix.shard }}
          BRAIAN_E2E_WORKERS: "1"
          BRAIAN_E2E_ISOLATE: "1"
          BRAIAN_BIN: ${{ runner.temp }}/ci-bins/braian
        run: |
          test -x "${BRAIAN_BIN}"
          node scripts/e2e.mjs

  # Required check name stays `stack`. A cancelled or skipped shard is red,
  # except the path-filter skip (mode=skip), where e2e and load are meant to skip.
  stack:
    needs: [bins, e2e, load]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Required check
        env:
          MODE: ${{ needs.bins.outputs.mode }}
          BINS: ${{ needs.bins.result }}
          E2E: ${{ needs.e2e.result }}
          LOAD: ${{ needs.load.result }}
        run: bash scripts/ci-aggregate.sh "$MODE" "$BINS" "$E2E" "$LOAD"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: English copy
        run: python3 scripts/check-english.py
      - name: Typecheck and unit tests
        run: |
          pnpm install --frozen-lockfile
          root="$(git rev-parse --show-toplevel)"
          pnpm --dir apps/web exec openapi-typescript "$root/docs/api/openapi.json" -o /tmp/schema.d.ts
          diff -u "$root/apps/web/src/api/schema.d.ts" /tmp/schema.d.ts
          pnpm --dir apps/web exec tsc --noEmit
          pnpm --dir apps/web exec vitest run
          pnpm --dir apps/landing exec tsc --noEmit
          pnpm --dir apps/landing build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: JavaScript licenses
        run: |
          pnpm install --frozen-lockfile
          node scripts/check-js-licenses.mjs
